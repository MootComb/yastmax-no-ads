name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install aarch64 cross toolchain (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build myinit-max
        run: aarch64-linux-gnu-gcc -static -s ./myinit-max.c -o myinit-max

      - name: Build myinit-max-dbg
        run: aarch64-linux-gnu-gcc -static -DDEBUG -s ./myinit-max.c -o myinit-max-dbg

      - name: Build mysudo
        run: aarch64-linux-gnu-gcc -static -s ./mysudo.c -o mysudo

      - name: Verify binaries
        run: file myinit-max myinit-max-dbg mysudo

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          body: |
            Built from VERSION file: `${{ steps.version.outputs.version }}`
          files: |
            myinit-max
            myinit-max-dbg
            mysudo
