name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read VERSION file
        id: version
        run: |
          VERSION="$(cat VERSION | tr -d '[:space:]')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential wget

      - name: Download musl ARM toolchain
        run: |
          wget -q "https://musl.cc/arm-linux-musleabihf-cross.tgz" -O musl.tgz
          tar -xzf musl.tgz
          echo "$PWD/arm-linux-musleabihf-cross/bin" >> "$GITHUB_PATH"

      - name: Build myinit-max
        run: arm-linux-musleabihf-gcc -static -s ./myinit-max.c -o myinit-max

      - name: Build myinit-max-dbg
        run: arm-linux-musleabihf-gcc -static -DDEBUG -s ./myinit-max.c -o myinit-max-dbg

      - name: Build mysudo
        run: arm-linux-musleabihf-gcc -static -s ./mysudo.c -o mysudo

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Release ${{ steps.version.outputs.version }}"
          body: |
            Built from VERSION file: `${{ steps.version.outputs.version }}`
          files: |
            myinit-max
            myinit-max-dbg
            mysudo
